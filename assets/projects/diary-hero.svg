<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Productivity Diary — Portfolio Hero Image</title>
  <desc id="desc">Editorial newspaper-style hero image showing productivity metrics with score chart, stars, and key indicators</desc>
  
  <!-- Background: Paper -->
  <rect width="1200" height="675" fill="#faf8f3"/>
  
  <!-- Decorative corner rules -->
  <line x1="40" y1="40" x2="120" y2="40" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="40" y1="40" x2="40" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="1080" y1="40" x2="1160" y2="40" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="1160" y1="40" x2="1160" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="40" y1="635" x2="120" y2="635" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="40" y1="555" x2="40" y2="635" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="1080" y1="635" x2="1160" y2="635" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="1160" y1="635" x2="1160" y2="555" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Masthead: Productivity Diary -->
  <text x="600" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="-1">Productivity Diary</text>
  
  <!-- Subtitle rule line -->
  <line x1="200" y1="140" x2="1000" y2="140" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="200" y1="148" x2="1000" y2="148" stroke="#1a1a1a" stroke-width="1"/>
  
  <!-- Section divider -->
  <line x1="80" y1="190" x2="1120" y2="190" stroke="#d4cfc4" stroke-width="1"/>
  
  <!-- KPI Row Labels -->
  <text x="150" y="240" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6b6b6b" text-anchor="middle" text-transform="uppercase" letter-spacing="1">Daily Focus</text>
  <text x="450" y="240" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6b6b6b" text-anchor="middle" text-transform="uppercase" letter-spacing="1">AI Tokens</text>
  <text x="750" y="240" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6b6b6b" text-anchor="middle" text-transform="uppercase" letter-spacing="1">Rating</text>
  <text x="1050" y="240" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6b6b6b" text-anchor="middle" text-transform="uppercase" letter-spacing="1">Period</text>
  
  <!-- KPI Values -->
  <text x="150" y="280" font-family="'Courier New', Courier, monospace" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="middle">3h 37m</text>
  <text x="450" y="280" font-family="'Courier New', Courier, monospace" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="middle">2.1M</text>
  <text x="750" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#8b1a1a" text-anchor="middle" letter-spacing="4">★★☆☆☆</text>
  <text x="1050" y="280" font-family="'Courier New', Courier, monospace" font-size="20" fill="#1a1a1a" text-anchor="middle">30 days</text>
  
  <!-- Chart area background -->
  <rect x="80" y="340" width="1040" height="240" fill="white" stroke="#d4cfc4" stroke-width="1" rx="4"/>
  
  <!-- Chart title -->
  <text x="120" y="375" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" fill="#1a1a1a">Daily Score Trend</text>
  
  <!-- Chart grid lines -->
  <line x1="120" y1="420" x2="1080" y2="420" stroke="#d4cfc4" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="120" y1="470" x2="1080" y2="470" stroke="#d4cfc4" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="120" y1="520" x2="1080" y2="520" stroke="#d4cfc4" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Chart Y-axis labels -->
  <text x="110" y="425" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b6b6b" text-anchor="end">40</text>
  <text x="110" y="475" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b6b6b" text-anchor="end">25</text>
  <text x="110" y="525" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6b6b6b" text-anchor="end">10</text>
  
  <!-- Chart area fill (subtle) -->
  <path d="M 120 520 L 120 450 L 200 430 L 280 460 L 360 410 L 440 390 L 520 420 L 600 400 L 680 440 L 760 410 L 840 380 L 920 420 L 1000 400 L 1080 430 L 1080 520 Z" 
        fill="#8b1a1a" opacity="0.08"/>
  
  <!-- Chart line -->
  <polyline points="120,450 200,430 280,460 360,410 440,390 520,420 600,400 680,440 760,410 840,380 920,420 1000,400 1080,430" 
            fill="none" stroke="#8b1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chart points -->
  <circle cx="120" cy="450" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="200" cy="430" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="280" cy="460" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="360" cy="410" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="440" cy="390" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="520" cy="420" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="600" cy="400" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="680" cy="440" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="760" cy="410" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="840" cy="380" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="920" cy="420" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="1000" cy="400" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  <circle cx="1080" cy="430" r="4" fill="#faf8f3" stroke="#8b1a1a" stroke-width="2"/>
  
  <!-- X-axis date labels -->
  <text x="120" y="560" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b6b6b" text-anchor="middle">10/01</text>
  <text x="440" y="560" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b6b6b" text-anchor="middle">10/10</text>
  <text x="760" y="560" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b6b6b" text-anchor="middle">10/20</text>
  <text x="1080" y="560" font-family="'Courier New', Courier, monospace" font-size="10" fill="#6b6b6b" text-anchor="middle">10/24</text>
  
  <!-- Bottom accent rule -->
  <line x1="200" y1="610" x2="1000" y2="610" stroke="#8b1a1a" stroke-width="2"/>
  
  <!-- Footer text -->
  <text x="600" y="645" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="0.5">PRODUCTIVITY TRACKING · AI USAGE MONITORING · DAILY COACHING</text>
</svg>
